[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-advisor-agent"
version = "0.1.0"
description = "Grounded personalized portfolio advice with what-if simulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
portfolio-advisor = "advisory_agent.cli:main"

[tool.setuptools.packages.find]
include = ["advisory_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
